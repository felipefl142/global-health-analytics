# Catalogo de indicadores (World Bank + WHO GHO) - codigos validados contra as APIs oficiais.
# A ingestao valida cada codigo e loga em data/bronze/ingest_log.json (WB) e ingest_log_who.json.
source: worldbank
api_base: "https://api.worldbank.org/v2"
who_api_base: "https://ghoapi.azureedge.net/api"
date_range:
  start: 1990
  end: 2023
per_page: 10000
countries: "all"

# ---- Alvos de predicao ----
targets:
  life_expectancy:            # M1 (regressao)
    code: "SP.DYN.LE00.IN"
    name: "Life expectancy at birth, total (years)"
  child_mortality:            # M2 (regressao) - under-5 (proxy padrao p/ mortalidade infantil)
    code: "SH.DYN.MORT"
    name: "Mortality rate, under-5 (per 1,000 live births)"
    note: "Indicador infantil (<1 ano) sem serie publica confiavel; under-5 e o outcome padrao."

# ---- Insumos do sistema de saude (componentes do proxy UHC) ----
uhc_inputs:
  health_exp_per_capita:
    code: "SH.XPD.CHEX.PC.CD"
    name: "Current health expenditure per capita (current US$)"
  health_exp_gdp:
    code: "SH.XPD.CHEX.GD.ZS"
    name: "Current health expenditure (% of GDP)"
  public_health_exp_gdp:
    code: "SH.XPD.GHED.GD.ZS"
    name: "Domestic general government health expenditure (% of GDP)"
  out_of_pocket:
    code: "SH.XPD.OOPC.CH.ZS"
    name: "Out-of-pocket health expenditure (% of current health expenditure)"
  doctors_per_1000:
    code: "SH.MED.PHYS.ZS"
    name: "Physicians (per 1,000 people)"
  nurses_per_1000:
    code: "SH.MED.NUMW.P3"
    name: "Nurses and midwives (per 1,000 people)"
  beds_per_1000:
    code: "SH.MED.BEDS.ZS"
    name: "Hospital beds (per 1,000 people)"
  sanitation_basic:
    code: "SH.STA.BASS.ZS"
    name: "People using at least basic sanitation services (% of population)"
  water_basic:
    code: "SH.H2O.BASW.ZS"
    name: "People using at least basic drinking water services (% of population)"
  sanitation_safely:
    code: "SH.STA.SMSS.ZS"
    name: "People using safely managed sanitation services (% of population)"
  water_safely:
    code: "SH.H2O.SMDW.ZS"
    name: "People using safely managed drinking water services (% of population)"
  measles_imm_pct:
    code: "SH.IMM.MEAS"
    name: "Immunization, measles (% of children ages 12-23 months)"
  dpt_imm_pct:
    code: "SH.IMM.IDPT"
    name: "Immunization, DPT (% of children ages 12-23 months)"

# ---- UHC oficial (SCI, serie anual 2000-2023) ----
# Validado ao vivo (2026-09): SH_UHC_SCI retorna serie anual; o codigo alternativo
# SH.UHC.NOEF nao existe nesta API. Coluna usada p/ validar o proxy UHC (F2).
uhc_official:
  uhc_sci:
    code: "SH_UHC_SCI"
    name: "UHC service coverage index (SCI)"
    note: "Serie anual 2000-2023; usada para validar o proxy de painel."

# ---- Covariados (confounders) ----
covariates:
  gdp_per_capita:
    code: "NY.GDP.PCAP.CD"
    name: "GDP per capita (current US$)"
  urban_pct:
    code: "SP.URB.TOTL.IN.ZS"
    name: "Urban population (% of total population)"
  fertility:
    code: "SP.DYN.TFRT.IN"
    name: "Fertility rate, total (births per woman)"
  population:
    code: "SP.POP.TOTL"
    name: "Population, total"

# ---- WHO GHO (fonte secundaria de enriquecimento via API OData) ----
# Carga de doenca/risco que complementa os alvos do World Bank.
who_gho:
  ncd_mortality_30_70:
    code: "NCDMORT3070"
    name: "Prob. de morrer entre 30 e 70 anos por DCNT (%)"
    sex: "SEX_BTSX"   # ambos os sexos (a serie tem dimensao de sexo)
  maternal_mortality:
    code: "MDG_0000000026"
    name: "Razao de mortalidade materna (por 100 000 nascidos vivos)"
  tb_incidence:
    code: "MDG_0000000020"
    name: "Incidencia de tuberculose (por 100 000 hab./ano)"
  road_traffic_death_rate:
    code: "RS_198"
    name: "Taxa estimada de mortalidade por transito (por 100 000 hab.)"
