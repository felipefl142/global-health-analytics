# Catalogo de indicadores (World Bank) - codigos validados contra a API oficial.
# A ingestao valida cada codigo e loga em data/bronze/ingest_log.json.
source: worldbank
api_base: "https://api.worldbank.org/v2"
date_range:
  start: 1990
  end: 2023
per_page: 10000   # a API rejeita per_page muito grande (HTTP 400); ingestao pagina
countries: "all"

# ---- Alvos de predicao ----
targets:
  life_expectancy:            # M1 (regressao)
    code: "SP.DYN.LE00.IN"
    name: "Life expectancy at birth, total (years)"
  child_mortality:            # M2 (regressao) - under-5 (proxy padrao p/ mortalidade infantil)
    code: "SH.DYN.MORT"
    name: "Mortality rate, under-5 (per 1,000 live births)"
    note: "Indicador infantil (<1 ano) sem serie publica confiavel; under-5 e o outcome padrao."

# ---- Insumos do sistema de saude (componentes do proxy UHC) ----
uhc_inputs:
  health_exp_per_capita:
    code: "SH.XPD.CHEX.PC.CD"
    name: "Current health expenditure per capita (current US$)"
  health_exp_gdp:
    code: "SH.XPD.CHEX.GD.ZS"
    name: "Current health expenditure (% of GDP)"
  public_health_exp_gdp:
    code: "SH.XPD.GHED.GD.ZS"
    name: "Domestic general government health expenditure (% of GDP)"
  out_of_pocket:
    code: "SH.XPD.OOPC.CH.ZS"   # substitui SH.XPD.OOPC.TO.ZS (removido da API)
    name: "Out-of-pocket expenditure (% of current health expenditure)"
  doctors_per_1000:
    code: "SH.MED.PHYS.ZS"
    name: "Physicians (per 1,000 people)"
  nurses_per_1000:
    code: "SH.MED.NUMW.P3"
    name: "Nurses and midwives (per 1,000 people)"
  beds_per_1000:
    code: "SH.MED.BEDS.ZS"
    name: "Hospital beds (per 1,000 people)"
  sanitation_basic:
    code: "SH.STA.BASS.ZS"
    name: "People using at least basic sanitation services (% of population)"
  water_basic:
    code: "SH.H2O.BASW.ZS"
    name: "People using at least basic drinking water services (% of population)"
  sanitation_safely:
    code: "SH.STA.SMSS.ZS"
    name: "People using safely managed sanitation services (% of population)"
  water_safely:
    code: "SH.H2O.SMDW.ZS"
    name: "People using safely managed drinking water services (% of population)"
  measles_imm_pct:
    code: "SH.IMM.MEAS"
    name: "Immunization, measles (% of children ages 12-23 months)"
  dpt_imm_pct:
    code: "SH.IMM.IDPT"
    name: "Immunization, DPT (% of children ages 12-23 months)"

# ---- UHC oficial (WHO/World Bank) ----
uhc_official:
  uhc_sci:
    code: "SH_UHC_SCI"
    name: "UHC service coverage index (SCI, 0-100)"
    note: "Serie anual 2000-2023 na API v2 (verificado em 2026-09). Validacao do proxy + feature."

# ---- Covariados (confounders) ----
covariates:
  gdp_per_capita:
    code: "NY.GDP.PCAP.CD"
    name: "GDP per capita (current US$)"
  urban_pct:
    code: "SP.URB.TOTL.IN.ZS"
    name: "Urban population (% of total population)"
  fertility:
    code: "SP.DYN.TFRT.IN"
    name: "Fertility rate, total (births per woman)"
  population:
    code: "SP.POP.TOTL"
    name: "Population, total"

# ---- Fonte 2: WHO Global Health Observatory (OData API) ----
# Enriquecimento (nao entra no proxy UHC). Filtro: paises, ambos os sexos.
who_gho:
  api_base: "https://ghoapi.azureedge.net/api"
  indicators:
    ncd_mortality_30_70:
      code: "NCDMORT3070"
      name: "Probability (%) of dying age 30-70 from CVD, cancer, diabetes or CRD"
    maternal_mortality:
      code: "MDG_0000000026"
      name: "Maternal mortality ratio (per 100 000 live births)"
    tb_incidence:
      code: "MDG_0000000020"
      name: "Incidence of tuberculosis (per 100 000 population per year)"
    road_traffic_deaths:
      code: "RS_198"
      name: "Estimated road traffic death rate (per 100 000 population)"
