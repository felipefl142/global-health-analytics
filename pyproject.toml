[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-health-analytics"
version = "0.1.0"
description = "Plataforma de analytics + causal A/B sobre dados publicos de saude global (WHO/World Bank)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", ".feast", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
