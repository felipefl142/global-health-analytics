name: Monitoring (drift)

on:
  schedule:
    - cron: "0 6 * * 1"   # toda segunda-feira 06:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pipeline completo (ingest -> silver -> gold -> train)
        run: |
          python -m src.ingestion.worldbank
          python -m src.ingestion.who_gho
          python -m src.transform.bronze_to_silver
          python -m src.transform.build_abt
          python -m src.modeling.train
      - name: Relatorio de drift
        run: python -m src.monitoring.drift
      - name: Publicar relatorio
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift_report.json
